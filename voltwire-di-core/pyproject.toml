[project]
name = "voltwire-di-core"
version = "0.0.0"
description = "Reusable framework-agnostic DI container & @component auto-discovery"
authors = [{name = "Hermann Steidel", email = "hsteidel.software@gmail.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "dependency-injector>=4.48.1,<5",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voltwire"]
