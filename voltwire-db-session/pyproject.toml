[project]
name = "voltwire-db-session"
version = "0.0.2"
description = "A configurable DB session factory"
authors = [{name = "Hermann Steidel", email = "hsteidel.software@gmail.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "sqlalchemy>=2.0,<3",
    "pydantic-settings>=2.3,<3",
    "pydantic>=2.9,<3",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voltwire"]
