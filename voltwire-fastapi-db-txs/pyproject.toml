[project]
name = "voltwire-fastapi-db-txs"
version = "0.0.0"
description = "FastAPI middleware and dependencies for request-scoped DB transaction management"
authors = [{name = "Hermann Steidel", email = "hsteidel.software@gmail.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "fastapi>=0.100.0",
    "starlette>=0.27.0",
    "voltwire-db-session>=0.0.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voltwire"]

[tool.uv.sources]
voltwire-db-session = {workspace = true}
